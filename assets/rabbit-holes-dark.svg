<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" role="img" aria-labelledby="title description">
  <title id="title">Ashutosh Kumar — rabbit_holes.log</title>
  <desc id="description">A curiosity backlog of questions to explore, not claims of expertise. 01. Local AI runtimes — OPEN: how runtimes expose models, memory and capabilities. 02. Motorcycle telemetry — CURIOUS: sensors, ECUs, CAN bus and what the machine is actually saying. 03. Small databases — QUEUED: storage engines, indexes and how data survives.</desc>
