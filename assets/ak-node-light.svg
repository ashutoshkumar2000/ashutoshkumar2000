<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title description">
  <title id="title">Ashutosh Kumar — Engineering Node</title>
  <desc id="description">Lead Software Engineer. BLR · India. Backend / full-stack / systems. Online. AK is the central node connected to Forge, Kubera, and Next ?. Systems thinking / hands-on building.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .ink { fill: #161616; }
    .muted { fill: #6F6256; }
    .accent { fill: #C7351D; }
    .rule { stroke: #D7C8B3; fill: none; }
    .online { animation: breathe 4.8s ease-in-out infinite; }
    .packet { display: none; fill: #C7351D; }
    @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
    @supports (offset-path: path("M 0 0 L 1 1")) {
      .packet { display: inline; offset-path: path("M 680 96 H 716 L 772 145"); animation: transmit 12s linear infinite; }
    }
    @keyframes transmit {
      0%, 12% { offset-distance: 0%; opacity: 0; }
      16% { offset-distance: 0%; opacity: .9; }
      42% { offset-distance: 100%; opacity: .9; }
      46%, 100% { offset-distance: 100%; opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .online, .packet { animation: none; }
      .packet { display: none; }
    }
  </style>

  <rect width="960" height="300" rx="6" fill="#F3EDE2"/>
  <rect x=".5" y=".5" width="959" height="299" rx="5.5" class="rule"/>
  <path d="M32 55H928 M32 254H928" class="rule"/>
  <path d="M32 55H77" stroke="#C7351D" stroke-width="2"/>

  <text x="32" y="35" class="ink" font-size="13" font-weight="600" letter-spacing="1.4">AK / ENGINEERING NODE</text>
  <circle cx="850" cy="30" r="3.5" class="accent online"/>
  <text x="864" y="35" class="ink" font-size="12" letter-spacing="1.2">ONLINE</text>

  <text x="30" y="126" class="ink" font-size="46" font-weight="700" letter-spacing="-2">ASHUTOSH KUMAR</text>
  <text x="32" y="162" class="ink" font-size="19">Lead Software Engineer</text>
  <text x="32" y="191" class="muted" font-size="14" letter-spacing="1.1">BLR · INDIA</text>
  <text x="32" y="228" class="muted" font-size="12" letter-spacing=".7">BACKEND / FULL-STACK / SYSTEMS</text>

  <path d="M574 83V229" class="rule"/>
  <g class="rule" stroke-width="1.2" stroke-linejoin="round">
    <path d="M680 96H716L772 145 M654 208H705L772 145"/>
    <path d="M772 145H819L878 204" stroke-dasharray="4 5"/>
  </g>
  <circle r="2.6" class="packet"/>
  <g fill="#F3EDE2" stroke="#6F6256" stroke-width="1.3">
    <circle cx="680" cy="96" r="5"/>
    <circle cx="654" cy="208" r="5"/>
    <circle cx="878" cy="204" r="5"/>
  </g>
  <circle cx="772" cy="145" r="15" fill="#F3EDE2" stroke="#C7351D" stroke-width="1.4"/>
  <circle cx="772" cy="145" r="6" class="accent"/>
  <text x="797" y="151" class="ink" font-size="19" font-weight="700">AK</text>
  <text x="653" y="78" class="muted" font-size="12" letter-spacing="1">FORGE</text>
  <text x="629" y="235" class="muted" font-size="12" letter-spacing="1">KUBERA</text>
  <text x="851" y="232" class="muted" font-size="12" letter-spacing="1">NEXT ?</text>

  <text x="32" y="280" class="muted" font-size="11" letter-spacing=".8">SYSTEMS THINKING / HANDS-ON BUILDING</text>
  <text x="928" y="280" text-anchor="end" class="muted" font-size="11" letter-spacing=".8">NODE 01 / ACTIVE</text>
</svg>
