<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title description">
  <title id="title">Ashutosh Kumar's garage</title>
  <desc id="description">Motorcycle-inspired engineering workbench. Ride mode: Build; other modes: Explore, Learn, Ride. Current build: Forge, a cross-platform local AI node manager, active. On the bench: Forge active, Kubera in development. Current rabbit hole: local AI infrastructure — runtimes, node discovery, LAN. Offline mode: motorcycles, long rides, reading how things are built.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .ink { fill: #F3EDE2; }
    .muted { fill: #8B949E; }
    .accent { fill: #C7351D; }
    .rule { stroke: #30363D; fill: none; }
    .selected { stroke: #C7351D; fill: none; animation: engage 4.8s ease-in-out infinite; }
    .active-dot { animation: breathe 4.8s ease-in-out infinite; }
    .diagnostic { display: none; fill: #C7351D; }
    @keyframes engage { 0%, 100% { stroke-opacity: 1; } 50% { stroke-opacity: .55; } }
    @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .6; } }
    @supports (offset-path: path("M 0 0 L 1 1")) {
      .diagnostic { display: inline; offset-path: path("M94 208A83 83 0 1 1 238 208"); animation: inspect 8s linear infinite; }
    }
    @keyframes inspect {
      0%, 12% { offset-distance: 0%; opacity: 0; }
      16%, 43% { opacity: .85; }
      47%, 100% { offset-distance: 100%; opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .selected, .active-dot, .diagnostic { animation: none; }
      .diagnostic { display: none; }
    }
  </style>

  <rect width="960" height="360" rx="6" fill="#0D1117"/>
  <rect x=".5" y=".5" width="959" height="359" rx="5.5" class="rule"/>
  <path d="M32 55H928 M32 254H928 M294 81V232 M604 81V232 M604 278V337" class="rule"/>
  <path d="M32 55H77" stroke="#C7351D" stroke-width="2"/>
  <text x="32" y="35" class="ink" font-size="15" font-weight="600" letter-spacing=".6">~/garage</text>
  <text x="928" y="35" text-anchor="end" class="ink" font-size="12" letter-spacing="1.2">MACHINE / ACTIVE</text>

  <!-- An unnumbered mode arc, not a speed, RPM, or progress gauge. -->
  <path d="M94 208A83 83 0 1 1 238 208" class="rule" stroke-width="5" stroke-dasharray="2 8"/>
  <path d="M166 84A83 83 0 0 1 209 96" fill="none" stroke="#C7351D" stroke-width="3"/>
  <circle r="2.4" class="diagnostic"/>
  <text x="166" y="129" text-anchor="middle" class="muted" font-size="12" letter-spacing="1.1">RIDE MODE</text>
  <rect x="108" y="141" width="116" height="44" rx="4" class="selected" stroke-width="1.3"/>
  <text x="166" y="171" text-anchor="middle" class="ink" font-size="29" font-weight="700" letter-spacing="1">BUILD</text>
  <text x="74" y="232" class="muted" font-size="12">EXPLORE</text>
  <text x="153" y="232" class="muted" font-size="12">LEARN</text>
  <text x="218" y="232" class="muted" font-size="12">RIDE</text>

  <text x="318" y="95" class="muted" font-size="12" letter-spacing="1.1">CURRENT BUILD</text>
  <text x="316" y="136" class="ink" font-size="31" font-weight="700" letter-spacing="-.8">FORGE</text>
  <text x="318" y="169" class="ink" font-size="15">Cross-platform local</text>
  <text x="318" y="192" class="ink" font-size="15">AI node manager</text>
  <circle cx="322" cy="220" r="3" class="accent active-dot"/>
  <text x="336" y="224" class="ink" font-size="12" letter-spacing="1">ACTIVE</text>

  <text x="628" y="95" class="muted" font-size="12" letter-spacing="1.1">ON THE BENCH</text>
  <path d="M628 170H928" class="rule"/>
  <text x="628" y="144" class="ink" font-size="15" font-weight="600">FORGE</text>
  <text x="928" y="144" text-anchor="end" class="ink" font-size="12">ACTIVE</text>
  <text x="628" y="196" class="ink" font-size="15" font-weight="600">KUBERA</text>
  <text x="928" y="196" text-anchor="end" class="muted" font-size="12">IN DEVELOPMENT</text>

  <text x="32" y="282" class="muted" font-size="12" letter-spacing="1.1">CURRENT RABBIT HOLE</text>
  <text x="32" y="311" class="ink" font-size="18" font-weight="600">LOCAL AI INFRASTRUCTURE</text>
  <text x="32" y="337" class="muted" font-size="12">RUNTIMES / NODE DISCOVERY / LAN</text>
  <text x="628" y="282" class="muted" font-size="12" letter-spacing="1.1">OFFLINE MODE</text>
  <text x="628" y="311" class="ink" font-size="14">MOTORCYCLES / LONG RIDES</text>
  <text x="628" y="337" class="muted" font-size="12">READING HOW THINGS ARE BUILT</text>
</svg>
